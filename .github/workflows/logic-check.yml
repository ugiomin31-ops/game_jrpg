name: Game logic regression checks
on:
  pull_request:
    paths: ["Assets/_Game/Scripts/Logic/**", "Assets/_Game/Resources/Data/**", "Tools/LogicTests/**", "Tools/logic_test.py", ".github/workflows/logic-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run engine-free regression tests
        run: python3 Tools/logic_test.py
